[workspace]
resolver = "3"
members = ["crates/colosseum-engine", "crates/colosseum-cli", "crates/colosseum-session", "crates/colosseum-web", "crates/colosseum-wasm", "crates/colosseum-worker", "crates/colosseum-tournament", "crates/colosseum-trainer", "crates/bots/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_yml = "0.0.12"
serde_json = "1"
clap = { version = "4.5", features = ["derive"] }
colosseum-engine = { path = "crates/colosseum-engine" }
colosseum-session = { path = "crates/colosseum-session" }
