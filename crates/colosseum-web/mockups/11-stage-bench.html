<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup 11 · Stage and Bench</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="round2.css">
<link rel="stylesheet" href="round3.css">
<style>
  /* Phase Stage, given room: square spaces, the ring picks the shape that
     fits, the middle shows only what this phase needs, and every player
     sits on an equal bench underneath (3, 4 or 5 seats). */
  .app { height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 14px; padding: 12px 18px 16px; }
  .bench { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); gap: 12px; }
</style>
</head>
<body>
<div class="app">
  <div class="bar3" id="bar"></div>
  <div class="ring-area" id="ring"></div>
  <div class="bench" id="bench"></div>
</div>
<script src="../static/icons.js"></script>
<script src="shared.js"></script>
<script src="round2.js"></script>
<script src="round3.js"></script>
<script>
  const drawBar = () => { document.getElementById('bar').innerHTML = `<span class="brand">Colosseum</span>${trackerHtml({ inline: true, clickable: true, phase: VIEW.phase })}<span class="spacer"></span>${topButtons()}`; };
  const bench = () => { const b = document.getElementById('bench'); b.style.setProperty('--n', STATE.n); b.innerHTML = STATE.players.map((_, i) => seat(i)).join(''); };
  drawBar(); bench();
  BOARDS.push(drawBar, bench);
  mountRing3(document.getElementById('ring'), stageHtml);
  mountChrome();
</script>
</body>
</html>
