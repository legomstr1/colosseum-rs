<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup 14 · Stage Bench v2</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="round2.css">
<link rel="stylesheet" href="round3.css">
<link rel="stylesheet" href="round4.css">
<style>
  /* Stage Bench, iterated. From Open Floor: your seat is wider and lists your
     programs by number and name; opponents stay compact and show their
     programs when you hover them. Dice carry Roman numerals. The trading
     stage has five states (switch them in the mockup pill). */
  .app { height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 14px; padding: 12px 18px 16px; }
  .bench { display: grid; grid-template-columns: minmax(0, 2.1fr) repeat(var(--o), minmax(0, 1fr)); gap: 12px; }
  body.embed .mockctl { display: none; }
</style>
</head>
<body>
<div class="app">
  <div class="bar3" id="bar"></div>
  <div class="ring-area" id="ring"></div>
  <div class="bench" id="bench"></div>
</div>
<script src="../static/icons.js"></script>
<script src="shared.js"></script>
<script src="round2.js"></script>
<script src="round3.js"></script>
<script src="round4.js"></script>
<script>
  if (PARAMS.get('embed')) document.body.classList.add('embed');
  const drawBar = () => { document.getElementById('bar').innerHTML = `<span class="brand">Colosseum</span>${trackerHtml({ inline: true, clickable: true, phase: VIEW.phase })}<span class="spacer"></span>${topButtons()}`; };
  const bench = () => {
    const b = document.getElementById('bench');
    b.style.setProperty('--o', STATE.n - 1);
    b.innerHTML = mySeat() + STATE.players.map((_, i) => (i ? oppSeat(i) : '')).join('');
  };
  drawBar(); bench();
  BOARDS.push(drawBar, bench);
  mountRing3(document.getElementById('ring'), stageHtml);
  mountChrome();
</script>
</body>
</html>
