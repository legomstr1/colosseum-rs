<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup 7 · Stadium</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="round2.css">
<style>
  /* Idea: an 11×9 board stands in the middle at full height, with you on the
     left and them on the right. The middle of the ring is the stadium floor:
     the round tracker, the dice and the turn controls live there, with the
     markets beneath and a one-line log ticker at the bottom. */
  .app { height: 100vh; display: grid; grid-template-columns: 300px minmax(0, 1fr) 300px; gap: 12px; padding: 12px; }
  .col { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
  .card { padding: 10px 12px; display: flex; flex-direction: column; gap: 7px; border-left: 5px solid var(--pc); min-height: 0; }
  .card .head { display: flex; align-items: center; gap: 8px; }
  .card .best { margin-left: auto; font-weight: 750; font-size: 18px; display: inline-flex; gap: 3px; align-items: center; }
  .card.me { flex: 1; overflow: auto; }
  .pl2 { display: flex; flex-direction: column; gap: 5px; }
  .pl2 .row1 { display: flex; gap: 7px; align-items: center; font-size: 12.5px; }
  .pl2 .t { font-weight: 600; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pl2.done { opacity: .5; }
  .them .card { flex: 1; overflow: hidden; }
  .them .mini { display: flex; flex-direction: column; gap: 2px; font-size: 11.5px; }
  .them .mini div { display: flex; gap: 5px; align-items: center; white-space: nowrap; overflow: hidden; }
  .them .mini .done { opacity: .5; }
  .floor { height: 100%; display: grid; grid-template-rows: auto auto auto minmax(0, 1fr); gap: 10px; padding: 14px 16px; background: #f8f1e2; border: 1px solid var(--line); border-radius: 18px; }
  .floor .turn { background: #fff; border: 2px solid var(--p0); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
  .floor .turn .bigdice .die { min-width: 58px; height: 58px; font-size: 22px; border-radius: 14px; }
  .ticker { display: flex; gap: 8px; align-items: center; font-size: 12.5px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px; }
  .ticker .last { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .floor .markets { grid-template-columns: repeat(5, minmax(0, 1fr)); }
  .logbox { min-height: 0; overflow: auto; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
  .mk { display: flex; flex-direction: column; gap: 8px; min-height: 0; }
</style>
</head>
<body>
<div class="app">
  <div class="col" id="me"></div>
  <div class="rfit" id="board"></div>
  <div class="col them" id="them"></div>
</div>
<script src="../static/icons.js"></script>
<script src="shared.js"></script>
<script src="round2.js"></script>
<script>
  const me = STATE.players[0];
  document.getElementById('me').innerHTML = `
    <div class="row"><span class="brand">Colosseum</span><span class="spacer"></span><button class="btn small">Menu</button></div>
    <div class="panel card me" style="--pc:var(--p0)">
      <div class="head"><span class="dot"></span><b>You · P1</b><span class="best">${icon('spectators')}${me.best}</span></div>
      ${statsLine(me)}<div class="row"><span class="hint">Stars</span>${starTiles(0)}</div>${playerToks(me, '')}
      <div class="hint" style="margin-top:6px">Your programs</div>
      ${me.programs.map((pr) => { const ev = event(pr.id); return `<div class="pl2 ${pr.produced ? 'done' : ''}"><div class="row1">${arenaIcon(ev)}<span class="t">${pr.produced ? CHECK + ' ' : ''}${ev.name}</span>${pr.produced ? bonusBadge() : '<button class="btn small" data-produce>Produce</button>'}</div>
        ${pr.produced ? '' : `${falloff(ev)}${needRow(ev, me.assets, { size: 'sm' })}`}</div>`; }).join('')}
    </div>
    <button class="btn" id="open" style="justify-content:space-between">Programs for sale (${STATE.forSale.length}) <kbd>P</kbd></button>`;
  document.getElementById('them').innerHTML = [1, 2, 3].map((i) => { const p = STATE.players[i]; return `<div class="panel card" style="--pc:${pColor(i)}">
    <div class="head"><span class="dot"></span><b>${pName(i)}</b><span class="muted">${p.seat}</span><span class="best">${icon('spectators')}${p.best}</span></div>
    ${statsLine(p)}<div class="row">${starTiles(i, 'xs')}</div>${playerToks(p, 'xs')}
    <div class="mini">${p.programs.map((pr) => { const ev = event(pr.id); return `<div class="${pr.produced ? 'done' : ''}">${arenaIcon(ev)}${pr.produced ? CHECK : ''}${ev.name}</div>`; }).join('')}</div></div>`; }).join('');
  mountRing(document.getElementById('board'), 11, 9, () => `<div class="floor">
    ${trackerHtml()}
    <div class="turn"><div class="row between"><b><span class="dot" style="--pc:var(--p0)"></span> Your turn: move a noble with each die</b><span class="bigdice">${diceButtons()}</span></div>
      <span class="hint">${moveHint()}</span>${moveChips()}
      <div class="row"><button class="btn small">${icon('medal')} Medal move</button><button class="btn small">Medal → 6 coins</button></div></div>
    <div class="mk">${marketsHtml({ size: 'sm' })}${supplyHtml()}</div>
    <div class="logbox"><b>Log</b>${logHtml()}</div></div>`);
  mountProgramModal(['open']);
</script>
</body>
</html>
