<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockup 6 · Wide Arena</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="round2.css">
<style>
  /* Idea: stretch the ring into a wide 14×6 track so it fills the width of a
     laptop screen; no dead space beside it. Them on top, you at the bottom,
     and the middle of the track is the control room. */
  .app { height: 100vh; display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; gap: 8px; padding: 8px 12px 10px; }
  .top { display: flex; align-items: center; gap: 18px; padding: 4px 4px 0; }
  .them { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .opp { padding: 8px 10px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; border-top: 4px solid var(--pc); }
  .opp .head { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; }
  .opp .best { margin-left: auto; font-weight: 750; display: inline-flex; gap: 3px; align-items: center; }
  .opp .progs { display: flex; flex-direction: column; gap: 2px; font-size: 11.5px; min-width: 0; }
  .opp .progs div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 5px; align-items: center; }
  .opp .progs .done { opacity: .5; }
  .zone { height: 100%; background: var(--soft); border: 1px solid var(--line); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
  .zone.turn { background: #fff; border: 2px solid var(--p0); }
  .zone h4 { margin: 0; font-size: 11px; letter-spacing: .6px; text-transform: uppercase; color: var(--muted); }
  .zone .log { overflow: auto; }
  .me { padding: 10px 12px; display: grid; grid-template-columns: 270px repeat(3, minmax(0, 1fr)); gap: 12px; border-top: 4px solid var(--p0); }
  .pc { border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; display: flex; flex-direction: column; gap: 6px; background: #fff; font-size: 12.5px; }
  .pc.done { opacity: .55; }
  .pc .t { font-weight: 650; }
</style>
</head>
<body>
<div class="app">
  <div class="top"><span class="brand">Colosseum</span><span id="trk"></span><span class="spacer"></span>
    <button class="btn" id="open">Programs for sale <kbd>P</kbd></button><button class="btn small">New game</button></div>
  <div class="them" id="them"></div>
  <div class="rfit" id="board"></div>
  <div class="panel me" id="me"></div>
</div>
<script src="../static/icons.js"></script>
<script src="shared.js"></script>
<script src="round2.js"></script>
<script>
  document.getElementById('trk').innerHTML = trackerHtml({ inline: true });
  document.getElementById('them').innerHTML = [1, 2, 3].map((i) => { const p = STATE.players[i]; return `<div class="panel opp" style="--pc:${pColor(i)}">
    <div class="head"><span class="dot"></span><b>${pName(i)}</b><span class="muted">${p.seat}</span>${starTiles(i, 'xs')}<span class="best">${icon('spectators')}${p.best}</span></div>
    <div style="display:flex;flex-direction:column;gap:5px">${statsLine(p)}${playerToks(p, 'xs')}</div>
    <div class="progs">${p.programs.map((pr) => { const ev = event(pr.id); return `<div class="${pr.produced ? 'done' : ''}">${arenaIcon(ev)}${pr.produced ? CHECK : ''}${ev.name}</div>`; }).join('')}</div></div>`; }).join('');
  mountRing(document.getElementById('board'), 14, 6, [
    { row: '2/6', col: '2/7', html: () => `<div class="zone turn"><div class="row between"><b><span class="dot" style="--pc:var(--p0)"></span> Your turn · move nobles</b>${diceButtons()}</div><span class="hint">${moveHint()}</span>${moveChips()}
      <div class="row" style="margin-top:auto"><button class="btn small">${icon('medal')} Medal move</button><button class="btn small">Medal → 6 coins</button></div></div>` },
    { row: '2/6', col: '7/11', html: () => `<div class="zone"><h4>Markets</h4>${marketsHtml({ size: 'sm' })}${supplyHtml()}</div>` },
    { row: '2/6', col: '11/14', html: () => `<div class="zone"><h4>Log</h4>${logHtml()}</div>` },
  ]);
  const me = STATE.players[0];
  document.getElementById('me').innerHTML = `
    <div style="display:flex;flex-direction:column;gap:6px"><div class="row"><span class="dot" style="--pc:var(--p0)"></span><b>You · P1</b>${starTiles(0)}<span class="spacer"></span><b>${icon('spectators')} ${me.best}</b></div>${statsLine(me)}${playerToks(me)}</div>
    ${me.programs.map((pr) => { const ev = event(pr.id); return `<div class="pc ${pr.produced ? 'done' : ''}">
      <div class="row" style="flex-wrap:nowrap">${arenaIcon(ev)}<span class="t">${pr.produced ? CHECK + ' ' : ''}${ev.name}</span><span class="spacer"></span>${pr.produced ? bonusBadge() : `<button class="btn small" data-produce>Produce</button>`}</div>
      ${pr.produced ? '<span class="hint">Adds +5 to each later event</span>' : `${falloff(ev)}${needRow(ev, me.assets, { size: 'sm' })}`}</div>`; }).join('')}`;
  mountProgramModal(['open']);
</script>
</body>
</html>
