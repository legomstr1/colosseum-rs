[package]
name = "colosseum-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The engine, the live-input bot and the GUI's JSON API compiled to WebAssembly, so the browser can play without a server"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
colosseum-engine.workspace = true
colosseum-session.workspace = true
colosseum-bot-live-input = { path = "../bots/live-input" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde_json.workspace = true
