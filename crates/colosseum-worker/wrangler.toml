# Online play (docs/ONLINE.md). Build the page first:
#   crates/colosseum-wasm/build.sh        # writes dist/ at the repo root
#   cd crates/colosseum-worker && npx wrangler dev
name = "colosseum"
main = "build/index.js"
compatibility_date = "2026-11-01"

[build]
command = "worker-build --release"

# The page and the WebAssembly engine. Asset requests are free and never
# run the Worker.
[assets]
directory = "../../dist"

# Seconds the seat to act may sit empty before the live-input bot plays it.
# The shared password is a secret: `npx wrangler secret put SITE_PASSWORD`,
# or SITE_PASSWORD=... in .dev.vars (gitignored) for `wrangler dev`.
[vars]
STANDIN_SECONDS = "120"

[[durable_objects.bindings]]
name = "GAMES"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "LoginLimiter"

# The free plan only allows SQLite-backed Durable Objects.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["LoginLimiter"]

# Finished games (docs/ONLINE.md). Locally: npx wrangler d1 migrations apply colosseum --local
# Before deploying: npx wrangler d1 create colosseum, paste its database_id
# here, then apply the migrations with --remote.
[[d1_databases]]
binding = "DB"
database_name = "colosseum"
database_id = "local-placeholder"
migrations_dir = "migrations"
