[package]
name = "colosseum-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cloudflare Worker for online play: creates games and relays moves through one Durable Object per game"

[lib]
crate-type = ["cdylib"]

[dependencies]
colosseum-engine.workspace = true
serde.workspace = true
serde_json.workspace = true
worker = { version = "0.9", features = ["d1"] }
serde-wasm-bindgen = "0.6"
hmac = "0.12"
sha2 = "0.10"
